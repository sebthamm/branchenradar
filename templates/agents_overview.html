{% extends "base.html" %}
{% block title %}Agenten &mdash; Übersicht{% endblock %}

{% block content %}
<div class="admin-wrap">
  <div class="admin-header">
    <div>
      <h1 class="admin-title">Agenten &mdash; Übersicht</h1>
      <p class="admin-subtitle">Zeitliche Abläufe und Abhängigkeiten aller Agenten</p>
    </div>
  </div>

  <div style="display:flex;gap:20px;margin-bottom:28px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)">
      <span style="width:12px;height:12px;border-radius:50%;background:var(--primary);display:inline-block"></span> Aktiv &amp; eigenständig
    </div>
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)">
      <span style="width:12px;height:12px;border-radius:50%;background:#6366f1;display:inline-block"></span> Aktiv &amp; getriggert
    </div>
    <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)">
      <span style="width:12px;height:12px;border-radius:50%;background:var(--border);display:inline-block"></span> Inaktiv
    </div>
  </div>

  <div id="overview-root" style="display:flex;flex-direction:column;gap:24px">
    <div style="color:var(--muted);font-size:13px">Wird geladen…</div>
  </div>
</div>

<style>
.ov-chain {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.ov-chain-head {
  padding: 14px 20px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.ov-chain-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: .06em;
}
.ov-chain-sub {
  font-size: 11px;
  color: var(--muted);
}
.ov-nodes {
  display: flex;
  align-items: center;
  overflow-x: auto;
  padding: 24px 20px;
  gap: 0;
}
.ov-node {
  display: flex;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
}
.ov-card {
  width: 160px;
  border-radius: 10px;
  border: 2px solid var(--border);
  overflow: hidden;
  background: var(--bg);
  flex-shrink: 0;
}
.ov-card.active-standalone { border-color: var(--primary); }
.ov-card.active-triggered  { border-color: #6366f1; }
.ov-card.inactive          { border-color: var(--border); opacity: .65; }
.ov-card-dot { height: 4px; }
.active-standalone .ov-card-dot { background: var(--primary); }
.active-triggered  .ov-card-dot { background: #6366f1; }
.inactive .ov-card-dot          { background: var(--border); }
.ov-card-body { padding: 12px 14px; }
.ov-card-name {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 3px;
}
.ov-card-role {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 8px;
  line-height: 1.4;
}
.ov-card-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
  font-weight: 600;
  margin-bottom: 6px;
}
.badge-active-s { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); }
.badge-active-t { background: color-mix(in srgb, #6366f1 15%, transparent); color: #6366f1; }
.badge-inactive { background: var(--surface2); color: var(--muted); }
.ov-card-detail {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.5;
}
.ov-arrow {
  width: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
}
.ov-arrow-line {
  height: 2px;
  width: 100%;
  background: var(--border);
}
.ov-arrow-head {
  position: absolute;
  right: 0;
  width: 0;
  height: 0;
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 8px solid var(--border);
}
.ov-arrow.active .ov-arrow-line { background: #6366f1; }
.ov-arrow.active .ov-arrow-head { border-left-color: #6366f1; }
</style>

<script>
(function() {
  function cardClass(ag) {
    if (!ag.schedule_enabled) return 'inactive';
    if (ag.trigger_mode && ag.trigger_mode !== 'standalone') return 'active-triggered';
    return 'active-standalone';
  }
  function badgeClass(ag) {
    if (!ag.schedule_enabled) return 'badge-inactive';
    if (ag.trigger_mode && ag.trigger_mode !== 'standalone') return 'badge-active-t';
    return 'badge-active-s';
  }
  function badgeLabel(ag) {
    if (!ag.schedule_enabled) return 'Inaktiv';
    if (ag.trigger_mode && ag.trigger_mode !== 'standalone') return 'Getriggert';
    return 'Aktiv';
  }
  var TRIGGER_LABELS = {
    after_fletcher: 'nach Fletcher',
    after_frank:    'nach Frank',
    after_finn:     'nach Finn',
    after_nils:     'nach Nils',
    after_theo:     'nach Theo'
  };
  function detailText(ag) {
    if (!ag.schedule_enabled) return 'Kein Zeitplan';
    var mode = ag.trigger_mode || 'standalone';
    if (mode !== 'standalone') return TRIGGER_LABELS[mode] || mode;
    return 'Alle ' + (ag.interval_days || 7) + ' Tage · ' + (ag.schedule_time || '06:00') + ' Uhr';
  }

  function buildCard(name, role, ag) {
    var cls = cardClass(ag);
    return '<div class="ov-card ' + cls + '">' +
      '<div class="ov-card-dot"></div>' +
      '<div class="ov-card-body">' +
        '<div class="ov-card-name">' + name + '</div>' +
        '<div class="ov-card-role">' + role + '</div>' +
        '<span class="ov-card-badge ' + badgeClass(ag) + '">' + badgeLabel(ag) + '</span>' +
        '<div class="ov-card-detail">' + detailText(ag) + '</div>' +
      '</div></div>';
  }

  function buildArrow(active) {
    return '<div class="ov-arrow' + (active ? ' active' : '') + '">' +
      '<div class="ov-arrow-line"></div>' +
      '<div class="ov-arrow-head"></div>' +
    '</div>';
  }

  function buildChain(title, sub, nodes) {
    var nodesHtml = '';
    nodes.forEach(function(n, i) {
      if (n.arrow !== undefined) {
        nodesHtml += buildArrow(n.arrow);
      } else {
        nodesHtml += '<div class="ov-node">' + buildCard(n.name, n.role, n.ag) + '</div>';
      }
    });
    return '<div class="ov-chain">' +
      '<div class="ov-chain-head"><span class="ov-chain-title">' + title + '</span>' +
      '<span class="ov-chain-sub">' + sub + '</span></div>' +
      '<div class="ov-nodes">' + nodesHtml + '</div>' +
    '</div>';
  }

  function buildTable(rows) {
    var trs = rows.map(function(r) {
      var ag = r.ag;
      if (!ag.schedule_enabled) {
        return '<tr><td style="padding:7px 12px;color:var(--text);font-weight:600">' + r.name + '</td>' +
          '<td colspan="3" style="padding:7px 12px;font-size:12px;color:var(--muted)">Inaktiv</td></tr>';
      }
      var mode = ag.trigger_mode || 'standalone';
      var interval = mode === 'standalone' ? (ag.interval_days || 7) + ' Tage' : '&mdash;';
      var time     = mode === 'standalone' ? (ag.schedule_time || '06:00') + ' Uhr' : '&mdash;';
      var trigger  = mode !== 'standalone' ? (TRIGGER_LABELS[mode] || mode) : '&mdash;';
      var dot = '<span style="width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:' +
        (mode !== 'standalone' ? '#6366f1' : 'var(--primary)') + '"></span>';
      return '<tr>' +
        '<td style="padding:7px 12px;font-weight:600;color:var(--text)">' + dot + r.name + '</td>' +
        '<td style="padding:7px 12px;font-size:12px;color:var(--muted)">' + interval + '</td>' +
        '<td style="padding:7px 12px;font-size:12px;color:var(--muted)">' + time + '</td>' +
        '<td style="padding:7px 12px;font-size:12px;color:var(--muted)">' + trigger + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="ov-chain">' +
      '<div class="ov-chain-head"><span class="ov-chain-title">Zeitplan-Tabelle</span>' +
      '<span class="ov-chain-sub">Alle Einstellungen auf einen Blick</span></div>' +
      '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">' +
        '<thead><tr style="background:var(--surface2)">' +
          '<th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Agent</th>' +
          '<th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Intervall</th>' +
          '<th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Uhrzeit</th>' +
          '<th style="padding:8px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)">Auslöser</th>' +
        '</tr></thead>' +
        '<tbody style="border-top:1px solid var(--border)">' + trs + '</tbody>' +
      '</table></div>' +
    '</div>';
  }

  function render(data) {
    var ag = data.agents || {};
    var fletcher = ag.fletcher_feed || {};
    var frank    = ag.frank_scrape  || {};
    var fred     = ag.feed          || {};
    var finn     = ag.scrape        || {};
    var theo     = ag.group         || {};
    var ida      = ag.bewertung     || {};
    var nils     = ag.source_research   || {};
    var maya     = ag.source_maintenance || {};

    var fredTriggered  = !!(fred.schedule_enabled  && fred.trigger_mode  === 'after_fletcher');
    var finnTriggered  = !!(finn.schedule_enabled  && finn.trigger_mode  === 'after_frank');
    var theoAfterFinn  = !!(theo.schedule_enabled  && theo.trigger_mode  === 'after_finn');
    var idaAfterTheo   = !!(ida.schedule_enabled   && ida.trigger_mode   === 'after_theo');

    var chain1 = buildChain('Feed-Kette', 'Fletcher &rarr; Fred &rarr; [Theo] &rarr; [Ida]', [
      {name:'Fletcher', role:'Quellen abrufen (Feed)', ag:fletcher},
      {arrow: fredTriggered},
      {name:'Fred', role:'KI-Analyse (Feed)', ag:fred},
      {arrow: theoAfterFinn},
      {name:'Theo', role:'Gruppierung', ag:theo},
      {arrow: idaAfterTheo},
      {name:'Ida', role:'Bewertung', ag:ida}
    ]);

    var chain2 = buildChain('Scrape-Kette', 'Frank &rarr; Finn &rarr; Theo &rarr; Ida', [
      {name:'Frank', role:'Quellen abrufen (Scrape)', ag:frank},
      {arrow: finnTriggered},
      {name:'Finn', role:'KI-Analyse (Scrape)', ag:finn},
      {arrow: theoAfterFinn},
      {name:'Theo', role:'Gruppierung', ag:theo},
      {arrow: idaAfterTheo},
      {name:'Ida', role:'Bewertung', ag:ida}
    ]);

    var chain3 = buildChain('Eigenständige Agenten', 'Nils (PDF) und Maya (Search) laufen unabhängig', [
      {name:'Nils', role:'Quellenrecherche', ag:nils},
      {arrow: false},
      {name:'Maya', role:'Web-Suche', ag:maya}
    ]);

    var table = buildTable([
      {name:'Fletcher (Feed abrufen)', ag:fletcher},
      {name:'Fred (Feed KI-Analyse)',  ag:fred},
      {name:'Frank (Scrape abrufen)',  ag:frank},
      {name:'Finn (Scrape KI-Analyse)',ag:finn},
      {name:'Nils (Quellenrecherche)', ag:nils},
      {name:'Maya (Search)',           ag:maya},
      {name:'Theo (Gruppierung)',      ag:theo},
      {name:'Ida (Bewertung)',         ag:ida}
    ]);

    document.getElementById('overview-root').innerHTML = chain1 + chain2 + chain3 + table;
  }

  function load() {
    fetch('/admin/agents/config')
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function() {
        document.getElementById('overview-root').innerHTML =
          '<div style="color:var(--muted)">Fehler beim Laden der Konfiguration.</div>';
      });
  }

  document.addEventListener('DOMContentLoaded', load);
})();
</script>
{% endblock %}
