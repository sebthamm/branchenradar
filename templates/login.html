{% extends "base.html" %}
{% block title %}Login — Praxis-Radar{% endblock %}
{% block head %}
<style>
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 72px); padding: 32px 16px; }
  .login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 36px 40px; width: 100%; max-width: 360px; }
  .login-title { font-family: Georgia, serif; font-size: 22px; font-weight: normal; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 28px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; color: var(--text); outline: none; transition: border-color .15s; margin-bottom: 18px; }
  input:focus { border-color: var(--navy); }
  .login-btn { width: 100%; padding: 10px; background: var(--navy); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .login-btn:hover { opacity: .88; }
</style>
{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-title">Anmelden</div>
    <div class="login-sub">Nur für Redakteure</div>
    <form method="post">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit" class="login-btn">Anmelden →</button>
    </form>
  </div>
</div>
{% endblock %}
